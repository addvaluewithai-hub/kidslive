name: Shootout - Godot Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/godot/**'
      - '.github/workflows/shootout-godot.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/godot/**'
      - '.github/workflows/shootout-godot.yml'

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: 'stable'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot Android SDK requirements
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'build-tools;35.0.1' \
            'platforms;android-35' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;28.1.13356709'

      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          sudo install -m 0755 "godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot

          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          mkdir -p templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          cp -R templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"
          godot --version

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and validate project
        shell: bash
        run: |
          godot --headless --path benchmarks/godot --import --quit
          godot --headless --path benchmarks/godot --editor --quit

      - name: Create throwaway benchmark signing key
        shell: bash
        run: |
          mkdir -p benchmarks/godot/build
          keytool -genkeypair -noprompt \
            -keystore benchmarks/godot/build/benchmark.keystore \
            -alias orbitwo \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass benchmark123 -keypass benchmark123 \
            -dname 'CN=Orbit Two,O=AddValueWithAI,C=US'

      - name: Export optimized Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/benchmarks/godot/build/benchmark.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: orbitwo
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: benchmark123
        run: |
          godot --headless --path benchmarks/godot --export-release Android build/orbit-two.apk
          test -s benchmarks/godot/build/orbit-two.apk

      - name: Upload Orbit Two APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-two-apk
          path: benchmarks/godot/build/orbit-two.apk
          retention-days: 14
