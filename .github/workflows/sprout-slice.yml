name: Sprout Slice

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sprout-mobile-stage-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Sprout mobile journey
        run: pnpm exec playwright test tests/sprout-planet.spec.ts --project=mobile-chromium
      - name: Upload Sprout visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprout-mobile-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
