name: Shootout - React Native Skia Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/skia/**'
      - '.github/workflows/shootout-skia.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/skia/**'
      - '.github/workflows/shootout-skia.yml'

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: benchmarks/skia
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: benchmarks/skia/package.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install benchmark dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependency alignment
        run: npx expo install --check

      - name: Typecheck benchmark
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build optimized release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Verify and rename APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk orbit-three.apk
          test -s orbit-three.apk

      - name: Upload Orbit Three APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-three-apk
          path: benchmarks/skia/orbit-three.apk
          retention-days: 14
