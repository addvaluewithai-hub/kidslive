name: Shootout - Phaser Capacitor Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.json'
      - '.github/workflows/shootout-phaser.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.json'
      - '.github/workflows/shootout-phaser.yml'

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build sharp Phaser candidate
        run: pnpm build

      - name: Install pinned Capacitor benchmark toolchain
        run: pnpm add -D @capacitor/cli@8.5.1 @capacitor/core@8.5.1 @capacitor/android@8.5.1

      - name: Generate native Android shell
        run: pnpm exec cap add android

      - name: Copy production web assets
        run: pnpm exec cap copy android

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Sign installable benchmark APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$unsigned_apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"

          keytool -genkeypair -v \
            -keystore benchmark.keystore \
            -storepass benchmark123 \
            -keypass benchmark123 \
            -alias benchmark \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=KidsLive Benchmark,O=AddValueWithAI,C=DE"

          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" kidslive-phaser-aligned.apk
          "$build_tools/apksigner" sign \
            --ks benchmark.keystore \
            --ks-pass pass:benchmark123 \
            --key-pass pass:benchmark123 \
            --ks-key-alias benchmark \
            --out kidslive-phaser-benchmark.apk \
            kidslive-phaser-aligned.apk
          "$build_tools/apksigner" verify --verbose kidslive-phaser-benchmark.apk
          test -s kidslive-phaser-benchmark.apk

      - name: Upload Phaser benchmark APK
        uses: actions/upload-artifact@v4
        with:
          name: kidslive-phaser-benchmark-apk
          path: kidslive-phaser-benchmark.apk
          retention-days: 14
